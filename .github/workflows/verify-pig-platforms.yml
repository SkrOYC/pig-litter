name: Verify PiG native platforms

on:
  push:
    branches:
      - chore/upgrade-pig-development-environment
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Prepare evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pig-platform-evidence"
          printf 'candidate=%s\nrunner_os=%s\nrunner_arch=%s\n' "$CANDIDATE_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > "$RUNNER_TEMP/pig-platform-evidence/runner.txt"
          uname -a >> "$RUNNER_TEMP/pig-platform-evidence/runner.txt"
      - name: Check out candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Set up Go 1.27.4
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify registration
        id: verify
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-pig-platforms.sh "$CANDIDATE_SHA" "$EXPECTED_OS" "$EXPECTED_ARCH" "$RUNNER_TEMP/pig-platform-evidence" 2>&1 | tee "$RUNNER_TEMP/pig-platform-evidence/verify.log"
      - name: Record step outcomes
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_OUTCOME: ${{ steps.go.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/pig-platform-evidence"
          printf 'checkout=%s\nsetup_go=%s\nverify=%s\n' "$CHECKOUT_OUTCOME" "$GO_OUTCOME" "$VERIFY_OUTCOME" > "$RUNNER_TEMP/pig-platform-evidence/steps.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pig-platform-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pig-platform-evidence
          if-no-files-found: error
