name: Collaboration platform probe

on:
  push:
    branches:
      - test/collaboration-platform-probe
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Optional candidate commit SHA to check out
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos-iterm:
    name: iTerm2 on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Check out the probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Run the probe
        timeout-minutes: 16
        env:
          PROBE_RUNNER_LABEL: ${{ matrix.runner }}
        run: bash scripts/probe-macos-collaboration.sh

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: collaboration-platform-${{ matrix.runner }}
          path: ${{ runner.temp }}/collaboration-platform-probe/
          if-no-files-found: warn
          retention-days: 14
