name: Collaboration platform probe

on:
  push:
    branches:
      - test/collaboration-platform-probe
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Optional candidate commit SHA to check out
        required: false
        type: string
      scenario:
        description: Platform capability probe, iTerm lifecycle diagnostic, or P03 product cases
        type: choice
        default: capability
        options:
          - capability
          - preflight
          - iterm-lifecycle
          - intel-window-forensics
          - intel-pig-window-forensics
          - fd-go-cache
          - p03-all
          - p03-team
          - p03-policy
          - p03-unselected
      architecture:
        description: Architectures for P03 product verification
        type: choice
        default: both
        options:
          - both
          - intel
          - arm

permissions:
  contents: read

jobs:
  macos-iterm:
    if: ${{ github.event_name == 'push' || inputs.scenario == 'capability' }}
    name: iTerm2 on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Check out the probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Check first-launch matcher
        run: bash scripts/probe-macos-collaboration.sh --test-first-launch-matcher

      - name: Run the probe
        timeout-minutes: 16
        env:
          PROBE_RUNNER_LABEL: ${{ matrix.runner }}
        run: bash scripts/probe-macos-collaboration.sh

      - name: Upload probe evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: collaboration-platform-${{ matrix.runner }}
          path: ${{ runner.temp }}/collaboration-platform-probe/
          if-no-files-found: error
          retention-days: 14

      - name: Retry evidence upload
        if: always() && steps.upload_evidence.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: collaboration-platform-${{ matrix.runner }}-retry
          path: ${{ runner.temp }}/collaboration-platform-probe/
          if-no-files-found: error
          retention-days: 14

  p03-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'preflight' }}
    name: P03 driver preflight on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'intel' && '["macos-15-intel"]' || inputs.architecture == 'arm' && '["macos-15"]' || '["macos-15-intel","macos-15"]') }}
    steps:
      - name: Check out the verification driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Record preflight tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p03-driver-preflight"
          {
            printf 'runner_os=%s\nrunner_arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            for tool in bash git mkdir python3; do command -v "$tool"; done
            bash --version
            git --version
            python3 --version
          } > "$RUNNER_TEMP/p03-driver-preflight/tools.txt" 2>&1
      - name: Check terminal input and fixture policy
        shell: bash
        run: python3 -B driver/scripts/test-p03-macos.py 2>&1 | tee "$RUNNER_TEMP/p03-driver-preflight/tests.txt"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p03-driver-preflight-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p03-driver-preflight/
          if-no-files-found: error
          retention-days: 14

  p03-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["p03-all","p03-team","p03-policy","p03-unselected"]'), inputs.scenario) }}
    name: P03 iTerm2 on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'intel' && '["macos-15-intel"]' || inputs.architecture == 'arm' && '["macos-15"]' || '["macos-15-intel","macos-15"]') }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_ref }}
      P03_SCENARIO: ${{ inputs.scenario }}
      P03_ARCHITECTURE: ${{ inputs.architecture }}
      PROBE_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Initialize evidence
        shell: bash
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/p03-macos-evidence"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          printf 'candidate=%s\nscenario=%s\narchitecture=%s\nworkflow_sha=%s\nrunner=%s\n' "$CANDIDATE_SHA" "$P03_SCENARIO" "$P03_ARCHITECTURE" "$GITHUB_WORKFLOW_SHA" "$PROBE_RUNNER_LABEL" > "$EVIDENCE_DIR/inputs.txt"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the verification driver
        id: checkout_driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Check out the exact product candidate
        id: checkout_candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check terminal input and fixture policy
        id: policy
        shell: bash
        run: python3 -B driver/scripts/test-p03-macos.py
      - name: Verify iTerm2 and scoped consent
        id: capability
        shell: bash
        working-directory: driver
        timeout-minutes: 16
        run: |
          bash scripts/probe-macos-collaboration.sh --test-first-launch-matcher
          bash scripts/probe-macos-collaboration.sh
      - name: Set up Go 1.27.4
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify P03 in iTerm2
        id: product
        shell: bash
        timeout-minutes: 75
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          DRIVER_ROOT: ${{ github.workspace }}/driver
        run: bash "$DRIVER_ROOT/scripts/verify-p03-macos.sh"
      - name: Release capability probe window
        if: ${{ always() && steps.checkout_driver.outcome == 'success' }}
        shell: bash
        run: python3 driver/scripts/p03-macos.py --cleanup-probe --evidence "${EVIDENCE_DIR:-$RUNNER_TEMP/p03-macos-evidence}"
      - name: Record workflow outcomes
        if: always()
        shell: bash
        env:
          DRIVER_OUTCOME: ${{ steps.checkout_driver.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.checkout_candidate.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          GO_OUTCOME: ${{ steps.go.outcome }}
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
        run: |
          EVIDENCE_DIR="${EVIDENCE_DIR:-$RUNNER_TEMP/p03-macos-evidence}"
          mkdir -p "$EVIDENCE_DIR"
          printf 'driver=%s\ncandidate=%s\npolicy=%s\ncapability=%s\nsetup_go=%s\nproduct=%s\n' "$DRIVER_OUTCOME" "$CANDIDATE_OUTCOME" "$POLICY_OUTCOME" "$CAPABILITY_OUTCOME" "$GO_OUTCOME" "$PRODUCT_OUTCOME" > "$EVIDENCE_DIR/workflow-outcomes.txt"
      - name: Upload P03 and capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p03-iterm-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p03-macos-evidence/
            ${{ runner.temp }}/collaboration-platform-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  iterm-lifecycle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'iterm-lifecycle' }}
    name: iTerm lifecycle on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'intel' && '["macos-15-intel"]' || inputs.architecture == 'arm' && '["macos-15"]' || '["macos-15-intel","macos-15"]') }}
    env:
      PROBE_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - name: Check out the verification driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Record diagnostic identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/iterm-lifecycle"
          git -C driver rev-parse HEAD > "$RUNNER_TEMP/iterm-lifecycle/driver-commit.txt"
          git -C driver rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/iterm-lifecycle/driver-tree.txt"
          git -C driver status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/iterm-lifecycle/driver-status.txt"
          test ! -s "$RUNNER_TEMP/iterm-lifecycle/driver-status.txt"
          printf 'scenario=%s\narchitecture=%s\nworkflow_sha=%s\nrunner=%s\n' '${{ inputs.scenario }}' '${{ inputs.architecture }}' "$GITHUB_WORKFLOW_SHA" "$PROBE_RUNNER_LABEL" > "$RUNNER_TEMP/iterm-lifecycle/inputs.txt"
      - name: Check diagnostic controls
        shell: bash
        run: python3 -B driver/scripts/test-iterm-lifecycle.py
      - name: Verify iTerm2 and scoped consent
        working-directory: driver
        shell: bash
        timeout-minutes: 16
        run: |
          bash scripts/probe-macos-collaboration.sh --test-first-launch-matcher
          bash scripts/probe-macos-collaboration.sh
      - name: Observe sequential owned windows
        shell: bash
        timeout-minutes: 10
        run: python3 -B driver/scripts/iterm-lifecycle.py --evidence "$RUNNER_TEMP/iterm-lifecycle"
      - name: Upload lifecycle and capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iterm-lifecycle-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iterm-lifecycle/
            ${{ runner.temp }}/collaboration-platform-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  intel-window-forensics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'intel-window-forensics' }}
    name: Intel iTerm window forensics
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      PROBE_RUNNER_LABEL: macos-15-intel
      SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
      SELECTED_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Check out the verification driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Record and check diagnostic identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/intel-window-forensics"
          git -C driver rev-parse HEAD > "$RUNNER_TEMP/intel-window-forensics/driver-commit.txt"
          git -C driver rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/intel-window-forensics/driver-tree.txt"
          git -C driver status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/intel-window-forensics/driver-status.txt"
          printf 'scenario=%s\narchitecture=%s\nworkflow_sha=%s\nrunner=%s\n' "$SELECTED_SCENARIO" "$SELECTED_ARCHITECTURE" "$GITHUB_WORKFLOW_SHA" "$PROBE_RUNNER_LABEL" > "$RUNNER_TEMP/intel-window-forensics/inputs.txt"
          test ! -s "$RUNNER_TEMP/intel-window-forensics/driver-status.txt"
          test "$SELECTED_ARCHITECTURE" = intel
      - name: Check diagnostic controls
        shell: bash
        run: python3 -B driver/scripts/test-iterm-intel-window-forensics.py
      - name: Verify iTerm2 and scoped consent
        working-directory: driver
        shell: bash
        timeout-minutes: 16
        run: |
          bash scripts/probe-macos-collaboration.sh --test-first-launch-matcher
          bash scripts/probe-macos-collaboration.sh
      - name: Observe the owned window and live control
        shell: bash
        timeout-minutes: 10
        run: python3 -B driver/scripts/iterm-intel-window-forensics.py --evidence "$RUNNER_TEMP/intel-window-forensics"
      - name: Upload diagnostic and capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel-window-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/intel-window-forensics/
            ${{ runner.temp }}/collaboration-platform-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  intel-pig-window-forensics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'intel-pig-window-forensics' }}
    name: Intel PiG window forensics
    runs-on: macos-15-intel
    timeout-minutes: 105
    env:
      PROBE_RUNNER_LABEL: macos-15-intel
      SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
      SELECTED_SCENARIO: ${{ inputs.scenario }}
      CANDIDATE_SHA: ${{ inputs.candidate_ref }}
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      DRIVER_ROOT: ${{ github.workspace }}/driver
    steps:
      - name: Check out the verification driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Record and check diagnostic inputs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/intel-pig-window-forensics"
          git -C driver rev-parse HEAD > "$RUNNER_TEMP/intel-pig-window-forensics/driver-commit.txt" || exit 1
          git -C driver rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/intel-pig-window-forensics/driver-tree.txt" || exit 1
          git -C driver status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/intel-pig-window-forensics/driver-status.txt" || exit 1
          printf 'scenario=%s\narchitecture=%s\ncandidate=%s\nworkflow_sha=%s\nrunner=%s\n' "$SELECTED_SCENARIO" "$SELECTED_ARCHITECTURE" "$CANDIDATE_SHA" "$GITHUB_WORKFLOW_SHA" "$PROBE_RUNNER_LABEL" > "$RUNNER_TEMP/intel-pig-window-forensics/inputs.txt"
          test ! -s "$RUNNER_TEMP/intel-pig-window-forensics/driver-status.txt" || exit 1
          test "$SELECTED_ARCHITECTURE" = intel || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Check out the exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check diagnostic controls
        shell: bash
        run: |
          python3 -B driver/scripts/test-iterm-intel-window-forensics.py
          python3 -B driver/scripts/test-iterm-intel-pig-forensics.py
      - name: Verify iTerm2 and scoped consent
        working-directory: driver
        shell: bash
        timeout-minutes: 16
        run: |
          bash scripts/probe-macos-collaboration.sh --test-first-launch-matcher
          bash scripts/probe-macos-collaboration.sh
      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Prepare the pinned native host and observe unselected PiG
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/intel-pig-window-forensics"
          actual_candidate=$(git -C "$CANDIDATE_ROOT" rev-parse HEAD) || exit 1
          test "$actual_candidate" = "$CANDIDATE_SHA" || exit 1
          git -C "$CANDIDATE_ROOT" status --porcelain=v1 --untracked-files=all > "$evidence/candidate-status.txt" || exit 1
          test ! -s "$evidence/candidate-status.txt" || exit 1
          git -C "$CANDIDATE_ROOT" rev-parse 'HEAD^{tree}' > "$evidence/candidate-tree.txt" || exit 1
          df -P /private/tmp > "$evidence/scratch-filesystem.txt" || exit 1
          device=$(tail -1 "$evidence/scratch-filesystem.txt" | awk '{print $1}') || exit 1
          [[ "$device" == /dev/disk* ]] || exit 1
          physical_tmp=$(cd /private/tmp && pwd -P) || exit 1
          test "$physical_tmp" = /private/tmp || exit 1
          scratch=$(mktemp -d /private/tmp/itp.XXXXXXXX) || exit 1
          scratch_id=$(stat -f '%d:%i' "$scratch") || exit 1
          printf 'path=%s\nidentity=%s\n' "$scratch" "$scratch_id" > "$evidence/scratch.txt"
          export GOTELEMETRY=off
          PIG_PLATFORM_ROOT_DIR="$CANDIDATE_ROOT" PIG_PLATFORM_SCRATCH_PARENT="$scratch" PIG_PLATFORM_CACHE_DIR='' PIG_PLATFORM_RECORD_CACHE_IDENTITY=1 \
            bash "$DRIVER_ROOT/scripts/verify-pig-platforms.sh" "$CANDIDATE_SHA" darwin amd64 "$evidence/native-platform" -- \
            python3 -B "$DRIVER_ROOT/scripts/iterm-intel-pig-forensics.py" --scratch "$scratch" --evidence "$evidence" 2>&1 | tee "$evidence/runner.log"
      - name: Record native observations in the job log
        if: always()
        shell: bash
        run: python3 -B driver/scripts/report-intel-native.py --evidence "$RUNNER_TEMP/intel-pig-window-forensics"
      - name: Upload diagnostic and capability evidence
        id: upload_native_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel-pig-window-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/intel-pig-window-forensics/
            ${{ runner.temp }}/collaboration-platform-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retry diagnostic evidence upload
        if: always() && steps.upload_native_evidence.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intel-pig-window-forensics-${{ github.run_id }}-${{ github.run_attempt }}-retry
          path: |
            ${{ runner.temp }}/intel-pig-window-forensics/
            ${{ runner.temp }}/collaboration-platform-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  fd-go-cache:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'fd-go-cache' }}
    name: Go file-descriptor cache probe on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'intel' && '["macos-15-intel"]' || inputs.architecture == 'arm' && '["macos-15"]' || '["macos-15-intel","macos-15"]') }}
    env:
      PROBE_RUNNER_LABEL: ${{ matrix.runner }}
      SELECTED_ARCHITECTURE: ${{ inputs.architecture }}
      SELECTED_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Check out the diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - name: Check diagnostic identity and controls
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/fd-go-cache"
          mkdir -p "$evidence"
          git -C driver rev-parse HEAD > "$evidence/driver-commit.txt" || exit 1
          git -C driver rev-parse 'HEAD^{tree}' > "$evidence/driver-tree.txt" || exit 1
          git -C driver status --porcelain=v1 --untracked-files=all > "$evidence/driver-status.txt" || exit 1
          test ! -s "$evidence/driver-status.txt" || exit 1
          case "$SELECTED_ARCHITECTURE" in intel|arm|both) ;; *) exit 1 ;; esac
          printf 'scenario=%s\narchitecture=%s\nworkflow_sha=%s\nrunner=%s\n' "$SELECTED_SCENARIO" "$SELECTED_ARCHITECTURE" "$GITHUB_WORKFLOW_SHA" "$PROBE_RUNNER_LABEL" > "$evidence/inputs.txt"
          python3 -B driver/scripts/test-fd-go-proof.py
      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - name: Run the isolated file-descriptor probe
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fd-go-cache"
          case "$PROBE_RUNNER_LABEL:$RUNNER_ARCH:$(uname -m)" in
            macos-15-intel:X64:x86_64) expected_arch=amd64 ;;
            macos-15:ARM64:arm64) expected_arch=arm64 ;;
            *) exit 1 ;;
          esac
          go_version=$(go version) || exit 1
          printf '%s\n' "$go_version" > "$evidence/go-version.txt"
          test "$go_version" = "go version go1.27.4 darwin/$expected_arch" || exit 1
          fixture_sha=30031c595872a19a0caa15f10c29fd427ac4ba056bd1bbfdbc7bab9440bc6754
          actual_sha=$(shasum -a 256 driver/scripts/fd-go-probe.py | awk '{print $1}') || exit 1
          test "$actual_sha" = "$fixture_sha" || exit 1
          df -P /private/tmp > "$evidence/scratch-filesystem.txt" || exit 1
          device=$(tail -1 "$evidence/scratch-filesystem.txt" | awk '{print $1}') || exit 1
          [[ "$device" == /dev/disk* ]] || exit 1
          physical_tmp=$(cd /private/tmp && pwd -P) || exit 1
          test "$physical_tmp" = /private/tmp || exit 1
          scratch=$(mktemp -d /private/tmp/fdg.XXXXXXXX) || exit 1
          scratch_id=$(stat -f '%d:%i' "$scratch") || exit 1
          printf 'path=%s\nidentity=%s\n' "$scratch" "$scratch_id" > "$evidence/scratch.txt"
          cp driver/scripts/fd-go-probe.py "$scratch/fd-go-probe.py" || exit 1
          staged_sha=$(shasum -a 256 "$scratch/fd-go-probe.py" | awk '{print $1}') || exit 1
          test "$staged_sha" = "$fixture_sha" || exit 1
          printf 'original=%s\nstaged=%s\n' "$actual_sha" "$staged_sha" > "$evidence/fixture-sha256.txt"
          probe_status=0
          python3 -B "$scratch/fd-go-probe.py" > "$evidence/proof.json" 2> "$evidence/probe.stderr" || probe_status=$?
          printf '%s\n' "$probe_status" > "$evidence/probe-exit.txt"
          sentinel_status=0
          python3 -B driver/scripts/verify-fd-go-proof.py --scratch "$scratch" --proof "$evidence/proof.json" --report "$evidence/outside-sentinel.json" || sentinel_status=$?
          test "$sentinel_status" -eq 0 || exit 1
          test "$probe_status" -eq 0 || exit 1
      - name: Upload file-descriptor probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fd-go-cache-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fd-go-cache/
          if-no-files-found: error
          retention-days: 14
