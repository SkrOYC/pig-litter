capabilities:
  - id: CAP-001
    group: Delegation
    priority: P0
    statement: "When a session delegates, Pig Litter must start a dependent child asynchronously with a fresh conversation and an explicit brief."
    rationale: "New work has independent context, and the parent can keep working."
    jobs: [JOB-01, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-002
    group: Delegation
    priority: P0
    statement: "The parent can choose the child's name at launch."
    rationale: A caller can recognize the child when coordinating work.
    jobs: [JOB-01, JOB-02]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-003
    group: Delegation
    priority: P0
    statement: "The parent can choose the child's existing working directory freely, subject to the rules for concurrent writers."
    rationale: A workflow can use a prepared worktree or another directory.
    jobs: [JOB-01]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-004
    group: Delegation
    priority: P0
    statement: "The parent can select the child's provider and model for a launch."
    rationale: Each assignment can use the model its caller chose.
    jobs: [JOB-01]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-005
    group: Delegation
    priority: P0
    statement: "The parent can select the child's reasoning effort for a launch."
    rationale: Different assignments can call for different amounts of reasoning.
    jobs: [JOB-01]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-006
    group: Delegation
    priority: P0
    statement: "The parent can launch a child with a custom agent profile. A profile can define instructions, tools, and a default model."
    rationale: The operator can reuse definitions for roles such as scout and worker.
    jobs: [JOB-01, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-007
    group: Delegation
    priority: P0
    statement: "The tools available to a child must stay within the permissions of its parent and its selected profile, where present."
    rationale: Delegation preserves the permission boundary at every level.
    jobs: [JOB-01, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-008
    group: Delegation
    priority: P0
    statement: "A session can start its own dependent children unless it is at the configured delegation depth or its profile is read-only."
    rationale: "A lead can split an assignment without a separate grant."
    jobs: [JOB-01, JOB-03, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-009
    group: Limits
    priority: P0
    statement: The operator can configure the active-session limit and delegation depth for a root tree.
    rationale: The operator can bound the size of a workflow.
    jobs: [JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-010
    group: Limits
    priority: P0
    statement: "A session counts as active while its own turn is open, including a turn blocked in a wait, or while any of its children is active. The root counts under the same rule. Other paused and finished sessions take no slots."
    rationale: "A parent keeps its slot while its children work, so a handback never needs a new slot."
    jobs: [JOB-01, JOB-03, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-011
    group: Limits
    priority: P0
    statement: "When a launch or wakeup would exceed concurrency, Pig Litter must reject it immediately with the same capacity error."
    rationale: Callers can decide how to proceed without queuing a launch or wakeup.
    jobs: [JOB-01, JOB-02, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-012
    group: Limits
    priority: P0
    statement: "When a launch would exceed the configured delegation depth, Pig Litter must reject it and state the reason."
    rationale: The caller gets a clear boundary on nested work.
    jobs: [JOB-01, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-013
    group: Limits
    priority: P0
    statement: "Concurrent write-capable dependent children in one root tree must have working directories that are neither equal nor nested. The root and read-only children are exempt."
    rationale: "Writers can use sibling directories, and readers can share them."
    jobs: [JOB-01, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-014
    group: Discovery
    priority: P0
    statement: "A root can list discoverable local peers with a name and an address for messaging, plus coarse busy or idle status when available."
    rationale: A sender can choose a peer without inspecting its private work.
    jobs: [JOB-02, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-015
    group: Discovery
    priority: P0
    statement: "Discoverable PiG roots and Claude Code sessions under the same operating-system account are eligible for peer messaging by default."
    rationale: Independently started sessions can coordinate without an opt-in step.
    jobs: [JOB-02]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-016
    group: Messaging
    priority: P0
    statement: "A PiG root can send and receive messages with other PiG roots and with local Claude Code peers."
    rationale: A workflow can combine PiG and Claude Code roles.
    jobs: [JOB-02, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-017
    group: Messaging
    priority: P0
    statement: "When a session receives a steer while active, Pig Litter must deliver it at the next applicable point in the current turn after running tool calls finish."
    rationale: "A sender can change the direction of ongoing work."
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-018
    group: Messaging
    priority: P0
    statement: "When an inactive session receives a steer and its tree has capacity, Pig Litter must wake it immediately in the same conversation."
    rationale: "A sender can restart work in a reachable paused, finished, or interrupted session."
    jobs: [JOB-02, JOB-03, JOB-04]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-019
    group: Messaging
    priority: P0
    statement: "For an outbound Claude Code message, Pig Litter must request immediate steering and state a known limitation that prevents it."
    rationale: "Interoperability preserves the sender's intent to steer the recipient."
    jobs: [JOB-02]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-020
    group: Messaging
    priority: P0
    statement: "Pig Litter must label each incoming message, automatic response, and notice with its origin: a peer, the parent, a child, the operator, or Pig Litter."
    rationale: "The recipient can tell who is speaking to it."
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-021
    group: Messaging
    priority: P0
    statement: "When a send fails, Pig Litter must report the failure and leave retries to the sender."
    rationale: The sender can decide whether to attempt delivery again.
    jobs: [JOB-02]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-022
    group: Messaging
    priority: P0
    statement: "When only a successful write to a Claude Code peer is known, Pig Litter must report that delivery is unconfirmed."
    rationale: A transport result carries only the certainty it establishes.
    jobs: [JOB-02]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-023
    group: Lifecycle
    priority: P0
    statement: Only the immediate parent can query the active state of a child as a managed session.
    rationale: Peer discovery and lifecycle authority remain distinct.
    jobs: [JOB-04]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-024
    group: Lifecycle
    priority: P0
    statement: "Only the immediate parent can pause a child. A pause ends the child's current work and leaves its descendants running."
    rationale: A parent can pause that session without stopping the rest of its branch.
    jobs: [JOB-04]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-025
    group: Lifecycle
    priority: P0
    statement: "Only the immediate parent can stop a child. If the stop would cascade, Pig Litter must warn that parent before it decides whether to stop the subtree."
    rationale: The caller can understand and accept the effect on descendants.
    jobs: [JOB-04, JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-026
    group: Lifecycle
    priority: P0
    statement: "A fully stopped child must be unavailable for messaging. A child that finishes a turn remains reachable by its parent."
    rationale: A full stop has a distinct effect from finishing work for the turn.
    jobs: [JOB-02, JOB-04, JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-027
    group: Lifecycle
    priority: P0
    statement: "When a root returns after a crash, Pig Litter must report the interrupted children to their parent session as a labeled notice. Each interrupted child stays reachable in the same conversation."
    rationale: "The parent can tell which work needs attention and can continue it."
    jobs: [JOB-04, JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-028
    group: Lifecycle
    priority: P0
    statement: "Ending the root must halt all live work in its tree. Reopening the root must make its dependent children reachable again."
    rationale: "The operator can halt everything a root owns without losing it."
    jobs: [JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-029
    group: Handbacks
    priority: P0
    statement: "When a child ends a turn with a final response or a failure and has no active children, Pig Litter must return its response and outcome to its immediate parent automatically."
    rationale: "A parent learns what the child finished, or that it failed, without needing to ask."
    jobs: [JOB-01, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-030
    group: Handbacks
    priority: P0
    statement: "Pig Litter must deliver the automatic response to the parent as a labeled steer, waking the parent if it is idle."
    rationale: A parent that ends its turn while waiting can continue when material arrives.
    jobs: [JOB-01, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-031
    group: Wait
    priority: P0
    statement: "A parent can wait for a direct child with a required timeout up to a configured maximum. The default maximum is 30 minutes."
    rationale: A parent can keep its turn open until the selected child responds or a bound is reached.
    jobs: [JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-032
    group: Wait
    priority: P0
    statement: "When the selected child messages its parent or produces an eligible final response, the wait must return a short status while the content reaches the parent through the normal steer."
    rationale: The same result reaches the parent whether or not it called wait.
    jobs: [JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-033
    group: Wait
    priority: P0
    statement: "If the selected child crashes or fully stops during a wait, the wait must return the failure immediately."
    rationale: The parent can handle interrupted work without waiting for the deadline.
    jobs: [JOB-03, JOB-04, JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-034
    group: Wait
    priority: P0
    statement: A wait must return on timeout. Unrelated steers remain pending while it is open and can take effect after the call returns.
    rationale: An unrelated message never interrupts the open call.
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-035
    group: Human interaction
    priority: P0
    statement: "In interactive PiG, the operator can open a full-view child overlay inside the root's view to follow the live transcript of any dependent child in the tree."
    rationale: "The operator can see the child's work in the same terminal interface."
    jobs: [JOB-05]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-036
    group: Human interaction
    priority: P0
    statement: "The operator can steer the child from its overlay. The steer arrives as operator input."
    rationale: The operator can redirect the child while observing its work.
    jobs: [JOB-05]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-037
    group: Human interaction
    priority: P0
    statement: "The child overlay must feel like the parent view and state any interactions that the released host can't support."
    rationale: The operator can see what is available in the child view.
    jobs: [JOB-05, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-038
    group: Human interaction
    priority: P0
    statement: "Agent-facing tools must keep other sessions' transcripts and traces private. Child launch, pause, and stop are agent actions."
    rationale: "The operator's view and the agent's authority serve distinct uses."
    jobs: [JOB-01, JOB-04, JOB-05]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-039
    group: Compatibility
    priority: P0
    statement: Pig Litter must support interactive and headless orchestration on macOS and Linux using unmodified PiG releases.
    rationale: The same orchestration primitives are available with or without a terminal interface.
    jobs: [JOB-01, JOB-02, JOB-03, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-040
    group: Compatibility
    priority: P0
    statement: Pig Litter must state hard limitations of released PiG and use capabilities the released host already provides.
    rationale: The operator can rely on the supported host without maintaining a patch.
    jobs: [JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-prd.md
      date: 2026-11-25
  - id: CAP-041
    group: Detached sessions
    priority: P0
    statement: "A root can launch a detached session with a brief, a name, a working directory, a provider and model, a reasoning effort, and an agent profile. The launch returns the detached session's peer address."
    rationale: "A lead can start independent work that other local sessions can reach."
    jobs: [JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-042
    group: Detached sessions
    priority: P0
    statement: "Only a root can launch a detached session. A dependent child can launch only dependent children."
    rationale: "Independent sessions are created only by sessions that head a tree."
    jobs: [JOB-06, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-043
    group: Detached sessions
    priority: P0
    statement: "A detached session must head its own root tree and take its limits and permissions from its own configuration."
    rationale: "Independent work is bounded by its own settings instead of its launcher's."
    jobs: [JOB-06, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-044
    group: Detached sessions
    priority: P0
    statement: "A detached session must keep running independently of its launcher and stay reachable while idle until its launcher stops it or the operator ends it."
    rationale: "A lead can send follow-up work to the same independent session."
    jobs: [JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-045
    group: Detached sessions
    priority: P0
    statement: "Only the launcher can stop a detached session through Pig Litter. The stop ends the detached session's whole tree after the cascade warning, and the launcher keeps this authority after it restarts."
    rationale: "Independent work that an agent started can be ended by that agent."
    jobs: [JOB-07, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-046
    group: Detached sessions
    priority: P0
    statement: "Pig Litter must give a detached session its launcher's peer address at launch."
    rationale: "The detached session can report back without searching for its launcher."
    jobs: [JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-047
    group: Detached sessions
    priority: P0
    statement: "Where a supported terminal pane host is available, Pig Litter must open a detached session in a pane as an interactive session. Otherwise it must run the session in the background. The launch result must state which form was used."
    rationale: "The operator can watch independent work where the terminal allows it."
    jobs: [JOB-06, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-048
    group: Messaging
    priority: P0
    statement: "Within a root tree, a session can message only its direct children and its own parent."
    rationale: "Coordination follows the delegation relationship."
    jobs: [JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-049
    group: Discovery
    priority: P0
    statement: "Only roots take part in peer discovery and peer messaging. Dependent children must be hidden from sessions outside their tree."
    rationale: "Each tree has one address to the outside."
    jobs: [JOB-02, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-050
    group: Discovery
    priority: P0
    statement: "The operator can turn peer messaging off for a root."
    rationale: "The operator can isolate a sensitive run."
    jobs: [JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-051
    group: Messaging
    priority: P0
    statement: "A send must return at once with its outcome and must never wait for the recipient to read or act on the message."
    rationale: "The sender keeps working and still learns whether the hand-off succeeded."
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-052
    group: Messaging
    priority: P0
    statement: "When a session's pending steers reach the configured bound, Pig Litter must fail further sends to it as recipient busy. Handbacks are exempt."
    rationale: "One sender cannot bury a session's next turn."
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-053
    group: Messaging
    priority: P0
    statement: "When a send exceeds the message size limit, Pig Litter must reject it and state the limit. Handbacks are delivered whole."
    rationale: "Nothing is truncated without the sender knowing."
    jobs: [JOB-02, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-054
    group: Delegation
    priority: P0
    statement: "A child's name must be unique across its root tree."
    rationale: "A name identifies one session in the tree."
    jobs: [JOB-01, JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-055
    group: Delegation
    priority: P0
    statement: "An agent profile must declare whether its role writes."
    rationale: "The directory rule and the delegation rule can tell writers from readers."
    jobs: [JOB-01, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-056
    group: Delegation
    priority: P0
    statement: "When a launch request has a problem that can be checked before the child exists, Pig Litter must reject the launch and state the reason."
    rationale: "A parent learns of a mistaken launch at once."
    jobs: [JOB-01, JOB-08]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-057
    group: Limits
    priority: P0
    statement: "When waking a session also requires slots for its inactive ancestors, Pig Litter must admit all of them or reject the wake."
    rationale: "The active-session limit holds for every session that becomes active."
    jobs: [JOB-03, JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-058
    group: Limits
    priority: P0
    statement: "A root must read its configuration when it starts or is reopened and apply those values to its tree until it ends. Agent profiles and settings come from the user level and from the root's project."
    rationale: "Admission decisions stay consistent for the life of a tree, and a child's directory cannot grant itself more."
    jobs: [JOB-06]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-059
    group: Wait
    priority: P0
    statement: "When the selected child is inactive and has no active children, a wait must return at once and state that the child is inactive."
    rationale: "A parent doesn't hold its turn open for an event that cannot occur."
    jobs: [JOB-03]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-060
    group: Lifecycle
    priority: P0
    statement: "A child interrupted by a crash must report a distinct interrupted state until its next turn starts. A fully stopped child must report as stopped to its former parent."
    rationale: "A parent can tell a crash, its own pause, finished work, and a stop apart."
    jobs: [JOB-04, JOB-07]
    certainty: settled
    evidence:
      kind: ruling
      ref: reports/2026-11-25-interview-architecture.md
      date: 2026-11-25
  - id: CAP-061
    group: Human interaction
    priority: P0
    statement: "In interactive PiG, the root's view must list every dependent session in the tree with its name, state, agent profile, and working directory, and list the detached sessions that the root launched separately."
    rationale: "The operator can find the session to open and see what a root has started."
    jobs: [JOB-05, JOB-08]
