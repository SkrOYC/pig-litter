terms:
  - term: Session
    definition: An agent conversation with its own turns and lifecycle. Pig Litter manages PiG sessions and can exchange messages with compatible Claude Code sessions.
    do_not_use: []
  - term: Root session
    definition: The PiG session at the top of a managed tree. It has no parent in that tree.
    do_not_use: []
  - term: Root tree
    definition: A root session and its managed descendants. The active sessions in the tree share one concurrency limit.
    do_not_use: []
  - term: Parent session
    definition: "The session that launches a direct child. It holds authority to check that child's active state, pause it, and stop it."
    do_not_use: []
  - term: Child session
    definition: A fresh PiG session started by a parent for a delegated assignment. It has its own conversation and can continue in that conversation while reachable.
    do_not_use: []
  - term: Peer
    definition: A discoverable local PiG or Claude Code session that can exchange messages. Peer status is coarse and confers no lifecycle authority.
    do_not_use: []
  - term: Agent profile
    definition: "A reusable role definition. It can supply instructions, tools, and a default model for a child."
    do_not_use: []
  - term: Turn
    definition: A unit of model work initiated by an input and ending with a response or an interruption.
    do_not_use: []
  - term: Active session
    definition: "A session that has an open turn, including one blocked in a wait. It counts toward its root tree's active-session limit."
    do_not_use: []
  - term: Paused session
    definition: "A reachable session whose work its parent paused. A peer steer can wake it, subject to admission limits."
    do_not_use: []
  - term: Finished session
    definition: A reachable session whose own turn ended with a final response. It can receive more work in the same conversation.
    do_not_use: []
  - term: Fully stopped session
    definition: A session whose lifecycle ended and that is unavailable for peer messaging.
    do_not_use: []
  - term: Steer
    definition: "Delivery of an input during the current turn after running tool calls finish. For an inactive reachable session, it starts a turn if admission allows it."
    do_not_use: []
  - term: Handback
    definition: An automatic response and outcome from a direct child whose turn ended with no active children. The parent receives it as a labeled steer.
    do_not_use: []
  - term: Wait
    definition: "A bounded tool call that stays open until the selected child sends its parent a message, provides an eligible handback, crashes, stops, or the timeout expires."
    do_not_use: []
  - term: Child overlay
    definition: "A full-view element inside the parent's interactive view. The operator uses it to see the child's live conversation and send a steer."
    do_not_use: []
  - term: Working directory
    definition: "The directory selected by the parent for a child's work. It determines whether concurrent writers overlap under the directory rule."
    do_not_use: []
